name: Capstone Voice Pipeline CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install audio system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsndfile1 ffmpeg espeak-ng

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Syntax check core modules
        run: |
          python -m py_compile server.py orchestrator/factory.py orchestrator/pipeline.py services/asr/asr_services.py services/nlp/nlp_services.py services/llm/json_utils.py services/tts/tts_services.py services/tts/voice_cloner.py ml/metrics/eval_metrics.py

      - name: Run offline unit, contract, anti-leakage & schema repair tests
        env:
          CI: "true"
        run: |
          pytest test_pipeline.py -v --tb=short -k "not test_whisper_transcription_live and not test_edge_tts_service_and_engine_api"
